name: Docker Image CI

# Bouwt het image bij elke push naar main en zet het op Docker Hub
# (mvanlaar/graphhopper:latest en :<GraphHopper-versie>). Bij een pull request alleen bouwen.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  buildx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: GraphHopper-versie uit de Dockerfile
        run: echo "GH_VERSION=$(grep -oP '^ARG GH_VERSION=\K.*' Dockerfile)" >> $GITHUB_ENV

      - name: Build (en push bij een push naar main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64
          tags: |
            mvanlaar/graphhopper:latest
            mvanlaar/graphhopper:${{ env.GH_VERSION }}
