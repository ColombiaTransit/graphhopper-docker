# GraphHopper-configuratie voor Colombia (GraphHopper 11).
# datareader.file en graph.location worden door entrypoint.sh gezet (-Ddw.graphhopper....).
graphhopper:
  datareader.file: ""
  graph.location: /data/graph-cache

  # Profielen: car (standaard) en bus (custom model van GraphHopper: zware/brede voertuigen,
  # alleen wegen waar bussen mogen, 90% van de autosnelheid). Bus wordt gebruikt om
  # gereconstrueerde busritten te valideren (afstand/reistijd tussen haltes).
  profiles:
    - name: car
      custom_model_files: [car.json]
    - name: bus
      custom_model_files: [bus.json]

  # Snelle modus (Contraction Hierarchies) voor beide profielen
  profiles_ch:
    - profile: car
    - profile: bus
  profiles_lm: []

  graph.encoded_values: car_access, car_average_speed, road_access, road_class, road_environment,
    max_weight, max_width, max_height, bus_access, toll, surface

  prepare.min_network_size: 200
  prepare.subnetworks.threads: 1

  routing.snap_preventions_default: tunnel, bridge, ferry
  # Lange busritten (bv. Bogotá - Cartagena ~1.100 km) moeten in één aanvraag passen
  routing.non_ch.max_waypoint_distance: 2000000

  import.osm.ignored_highways: footway,construction,cycleway,path,steps,pedestrian
  graph.dataaccess.default_type: RAM_STORE

server:
  application_connectors:
  - type: http
    port: 8989
    bind_host: 0.0.0.0
    max_request_header_size: 50k
  request_log:
      appenders: []
  admin_connectors:
  - type: http
    port: 8990
    bind_host: localhost

logging:
  appenders:
    - type: console
      time_zone: UTC
      log_format: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
